<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MathSpark · My math journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=6novD"></head>
<body data-theme="jungle">
<div id="app-root">
  <div id="deco"></div>
  <header class="top"><div class="top-in">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="12" fill="var(--primary)"/><path d="M11 14h7M14.5 10.5v7M22 14h7M11 26l6-6M11 20l6 6M22 24h7M22 28h7" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><path d="M33 2l1.6 3.4 3.4.4-2.6 2.3.8 3.5-3.2-1.8-3.2 1.8.8-3.5-2.6-2.3 3.4-.4z" fill="var(--accent)"/></svg>
      <span>MathSpark</span>
    </div>
    <nav class="nav" id="nav">
      <button data-view="library" id="navPlay" class="on hidden">🏠<span class="nl"> Play</span></button>
      <button data-view="create" id="navCreate" class="hidden">✨<span class="nl"> Create</span></button>
      <button data-view="share" id="navShare" class="hidden">📤<span class="nl"> Share &amp; results</span></button>
    </nav>
    <span id="offlineBadge" class="offline-badge hidden">Offline copy</span>
    <div class="tools">
      <button class="pill hidden" id="whoBtn" title="Change name"></button>
      <span class="starcount" id="starCount" title="Stars you collected">⭐ <b>0</b></span>
      <button class="pill" id="themeBtn" title="Change theme">🎨</button>
            <button class="pill on" id="soundBtn" title="Sound" aria-label="Sound">🔊</button>
    </div>
  </div></header>
  <main id="main"></main>
  <div id="modal" class="hidden"></div>
  <div id="toast"></div>
  <canvas id="confetti"></canvas>
</div>
<script src="config.js"></script>
<script src="missions.js?v=6novD"></script>
<script src="app.js?v=6novD"></script>
</body></html>
